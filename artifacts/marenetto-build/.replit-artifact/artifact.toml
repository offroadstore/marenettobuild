kind = "web"
previewPath = "/"
title = "Marenetto Build"
description = "Sito web multilingue per Marenetto Build a Cefalù: servizi, metodo di lavoro, contenuti per proprietari internazionali e invio di richieste."
version = "1.0.0"
id = "artifacts/marenetto-build"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 19698

[services.development]
run = "pnpm --filter @workspace/marenetto-build run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/marenetto-build", "run", "build"]

[services.production.run]
args = ["node", "artifacts/marenetto-build/scripts/serve-seo.mjs"]

[services.production.run.env]
PORT = "19698"
NODE_ENV = "production"
# Same-revision API listener declared by artifacts/api-server; not the
# deployment proxy's dynamically assigned port or the public deployment URL.
EDITORIAL_API_ORIGIN = "http://127.0.0.1:8080"

[services.production.health.startup]
path = "/__release-readiness"

[services.env]
PORT = "19698"
BASE_PATH = "/"
