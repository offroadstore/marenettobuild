openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: requests
    description: Project request operations
  - name: internal
    description: Invite-only internal operations for content and leads.
  - name: storage
    description: Private attachment upload and serving.
paths:
  /internal/monitoring/stream/verify:
    post:
      operationId: verifyMonitoringStream
      tags: [internal]
      responses:
        "200":
          description: Stream membership checked independently from isolated runtime
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/discovery:
    post:
      operationId: refreshMonitoringDiscovery
      tags: [internal]
      responses:
        "200":
          description: Current static HTML checked, or last result retained as stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/ai:
    get:
      operationId: getAiVisibility
      tags: [internal]
      responses:
        "200":
          description: monitoring manage only, minimized history and configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiVisibility" }
    put:
      operationId: saveAiVisibility
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsInput" }
      responses:
        "200":
          description: Saved without executing a campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/ai/run:
    post:
      operationId: startAiVisibility
      tags: [internal]
      responses:
        "200":
          description: Durable campaign or explicit blocking reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /monitoring/ai/tick:
    post:
      operationId: tickAiVisibility
      description: External signed worker heartbeat, never enabled by delivery. No user session authentication.
      responses:
        "200":
          description: Single durable checkpoint processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
        "403": { description: Invalid signature or preview environment }
  /internal/monitoring/bing:
    get:
      operationId: getBingSettings
      tags: [internal]
      responses:
        "200":
          description: Owner only, runtime configuration status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BingSettings" }
    put:
      operationId: saveBingSettings
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringPropertyInput" }
      responses:
        "200":
          description: Property validated against verified sites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/bing/sites:
    get:
      operationId: listBingSites
      tags: [internal]
      responses:
        "200":
          description: Verified Bing sites, no credentials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MonitoringProperty" }
  /call-requests/config:
    get:
      operationId: getCallRequestConfig
      tags: [requests]
      responses:
        "200":
          description: Current data mode, never approval flags or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallConfig" }
  /call-requests:
    post:
      operationId: createCallRequest
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallRequestInput" }
      responses:
        "201":
          description: Persisted receipt; delivery is reported separately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallReceipt" }
        "200":
          description: Original idempotent receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallReceipt" }
        "400": { description: Invalid input }
        "409": { description: Idempotency conflict }
        "429": { description: Shared persistent rate limit }
        "503": { description: Storage unavailable }
  /internal/call-requests:
    get:
      operationId: listCallRequests
      tags: [internal]
      parameters:
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
        - { name: language, in: query, schema: { $ref: "#/components/schemas/CallLocale" } }
        - { name: project, in: query, schema: { $ref: "#/components/schemas/CallProject" } }
        - { name: intent, in: query, schema: { $ref: "#/components/schemas/ProfessionalIntent" } }
        - { name: professionalProjectType, in: query, schema: { $ref: "#/components/schemas/ProfessionalProjectType" } }
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CallStatus" } }
      responses:
        "200":
          description: Owner only, never included in generic leads or KPIs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CallRecord" }
        "401": { description: Authentication required }
        "403": { description: Owner required }
  /internal/call-requests/export:
    get:
      operationId: exportCallRequests
      tags: [internal]
      parameters:
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
        - { name: language, in: query, schema: { $ref: "#/components/schemas/CallLocale" } }
        - { name: project, in: query, schema: { $ref: "#/components/schemas/CallProject" } }
        - { name: intent, in: query, schema: { $ref: "#/components/schemas/ProfessionalIntent" } }
        - { name: professionalProjectType, in: query, schema: { $ref: "#/components/schemas/ProfessionalProjectType" } }
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CallStatus" } }
      responses:
        "200":
          description: Formula-safe private CSV
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Authentication required }
        "403": { description: Owner required }
  /internal/call-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateCallRequest
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallUpdate" }
      responses:
        "200":
          description: Owner-only saved changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallRecord" }
        "403": { description: Owner required }
    delete:
      operationId: deleteCallRequest
      tags: [internal]
      responses:
        "204": { description: Request and associated deliveries removed }
        "403": { description: Owner required }
  /google-reviews:
    get:
      operationId: getGoogleReviews
      summary: Fresh server-only Places reviews, never stored or statically rendered
      responses:
        "200":
          description: Null data means keep the existing outbound link
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store, max-age=0" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleReviewsResponse"
  /monitoring/public:
    get:
      operationId: getPublicMonitoring
      responses:
        "200":
          description: Fail-closed collection configuration, never credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMonitoring" }
  /internal/monitoring/collection:
    put:
      operationId: saveMonitoringCollection
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringCollectionInput" }
      responses:
        "200":
          description: Owner-only activation or emergency stop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/collection/verify:
    post:
      operationId: verifyMonitoringCollection
      tags: [internal]
      responses:
        "200":
          description: Check matching web stream and disabled enhanced measurement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/collection/realtime:
    post:
      operationId: verifyMonitoringRealtime
      tags: [internal]
      responses:
        "200":
          description: Dated realtime read, not an end-to-end release approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring:
    get:
      operationId: getMonitoring
      tags: [internal]
      responses:
        "200":
          description: Safe monitoring settings, never credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringSettings" }
  /internal/monitoring/google/start:
    post:
      operationId: startMonitoringGoogle
      tags: [internal]
      responses:
        "200":
          description: Owner-only Google consent URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
  /internal/monitoring/google/callback:
    get:
      operationId: finishMonitoringGoogle
      tags: [internal]
      responses:
        "303":
          description: Return to the internal console after session-bound consent
  /internal/monitoring/google/disconnect:
    post:
      operationId: disconnectMonitoringGoogle
      tags: [internal]
      responses:
        "200":
          description: Connection removed locally and revocation outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/properties/{service}:
    parameters:
      - name: service
        in: path
        required: true
        schema: { $ref: "#/components/schemas/GoogleReportService" }
    get:
      operationId: listMonitoringProperties
      tags: [internal]
      responses:
        "200":
          description: Actually accessible Google properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MonitoringProperty" }
    put:
      operationId: selectMonitoringProperty
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringPropertyInput" }
      responses:
        "200":
          description: Selection validated against Google permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/verify/{service}:
    parameters:
      - name: service
        in: path
        required: true
        schema: { $ref: "#/components/schemas/GoogleReportService" }
    post:
      operationId: verifyMonitoringService
      tags: [internal]
      responses:
        "200":
          description: Explicit connection test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/monitoring/tags:
    put:
      operationId: saveMonitoringTags
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringTagInput" }
      responses:
        "200":
          description: Public identifiers only; changes disable collection and invalidate its checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringAction" }
  /internal/dashboard:
    get:
      operationId: getKpiDashboard
      tags: [internal]
      parameters:
        - { name: compare, in: query, schema: { type: string, enum: ["true", "false"], default: "true" } }
        - { name: source, in: query, schema: { type: string, enum: [all, ga4, searchConsole, bing, ai], default: all } }
        - { name: device, in: query, schema: { type: string, enum: [desktop, mobile, tablet] } }
        - { name: country, in: query, schema: { type: string, maxLength: 80 } }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: string, maxLength: 200 } }
        - { name: channel, in: query, schema: { type: string, maxLength: 80 } }
        - { name: trafficSource, in: query, schema: { type: string, maxLength: 80 } }
        - { name: query, in: query, schema: { type: string, maxLength: 160 } }
        - { name: provider, in: query, schema: { $ref: "#/components/schemas/AiProvider" } }
        - { name: question, in: query, schema: { type: string, maxLength: 20 } }
        - { name: pageLanguage, in: query, schema: { type: string, maxLength: 5 } }
        - name: days
          in: query
          schema: { type: integer, enum: [7, 28, 90], default: 28 }
        - name: start
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: end
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Independent Google and operational sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KpiDashboard" }
  /internal/editorial:
    get:
      operationId: listEditorial
      tags: [internal]
      responses:
        "200":
          description: Editorial coverage, never synthetic
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EditorialSummary" }
    post:
      operationId: createEditorial
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialInput" }
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDetail" }
  /internal/editorial/{editionId}:
    parameters:
      - name: editionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEditorial
      tags: [internal]
      responses:
        "200":
          description: Private revision history and immutable originals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDetail" }
    put:
      operationId: saveEditorial
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialSave" }
      responses:
        "200":
          description: Saved a new immutable revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDetail" }
  /internal/editorial/{editionId}/action:
    parameters:
      - name: editionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: actEditorial
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialAction" }
      responses:
        "200":
          description: Explicit editorial transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDetail" }
  /editorial/active:
    get:
      operationId: getActiveEditorial
      responses:
        "200":
          description: Only explicitly active editions, never drafts or originals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EditorialActive" }
  /historical-media/{asset}:
    get:
      operationId: getHistoricalMedia
      tags: [storage]
      summary: Serve an immutable, inventoried historical website image
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}\.(png|jpg|jpeg|webp|gif)$'
      responses:
        "200":
          description: Image bytes copied without modification from the public historical source
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Image is not in the public historical inventory
        "503":
          description: Archived image temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /project-requests:
    post:
      operationId: createProjectRequest
      tags: [requests]
      summary: Submit a project request
      description: Stores a project enquiry before returning its reference code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequestInput"
      responses:
        "201":
          description: Request stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRequestReceipt"
        "400":
          description: Invalid request
  /cms/pages/{locale}/{slug}:
    get:
      operationId: getPublishedCmsPage
      tags: [internal]
      summary: Load a published CMS page
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "404":
          description: Published page not found
  /internal/session:
    get:
      operationId: getInternalSession
      tags: [internal]
      summary: Get the current invite-only staff session
      responses:
        "200":
          description: Authorized internal user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalSession"
        "401":
          description: Sign in required
        "403":
          description: The signed-in email has no active invitation
  /internal/leads:
    get:
      operationId: listInternalLeads
      tags: [internal]
      summary: List project enquiries for the internal team
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadStatus"
      responses:
        "200":
          description: Enquiries visible to the current staff member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectLead"
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
  /internal/leads/{leadId}:
    patch:
      operationId: updateInternalLead
      tags: [internal]
      summary: Update lead status, assignment, or internal notes
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectLead"
        "400":
          description: Invalid update
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
        "404":
          description: Enquiry not found
  /internal/cms/pages:
    get:
      operationId: listCmsPages
      tags: [internal]
      summary: List CMS pages
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: CMS pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CmsPage"
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
    post:
      operationId: createCmsPage
      tags: [internal]
      summary: Create a CMS page draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsPageInput"
      responses:
        "201":
          description: CMS draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "400":
          description: Invalid page
        "401":
          description: Sign in required
        "403":
          description: CMS permission required
  /internal/cms/pages/{pageId}:
    patch:
      operationId: updateCmsPage
      tags: [internal]
      summary: Edit or publish a CMS page
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsPageUpdate"
      responses:
        "200":
          description: Updated CMS page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "400":
          description: Invalid page update
        "401":
          description: Sign in required
        "403":
          description: CMS permission required
        "404":
          description: Page not found
  /internal/notifications:
    get:
      operationId: listInternalNotifications
      tags: [internal]
      summary: List persistent internal notifications
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InternalNotification"
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
  /internal/notifications/{notificationId}:
    patch:
      operationId: updateInternalNotification
      tags: [internal]
      summary: Mark a notification read or unread
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationUpdate"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalNotification"
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
        "404":
          description: Notification not found
  /internal/members:
    get:
      operationId: listInternalMembers
      tags: [internal]
      summary: List invitations and team permissions
      responses:
        "200":
          description: Team membership
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InternalMember"
        "401":
          description: Sign in required
        "403":
          description: Owner permission required
    post:
      operationId: inviteInternalMember
      tags: [internal]
      summary: Invite a team member by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalMemberInput"
      responses:
        "201":
          description: Invitation saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalMember"
        "400":
          description: Invalid invitation
        "401":
          description: Sign in required
        "403":
          description: Owner permission required
  /internal/members/{memberId}:
    patch:
      operationId: updateInternalMember
      tags: [internal]
      summary: Change a member role or revoke access
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalMemberUpdate"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalMember"
        "400":
          description: Invalid membership update
        "401":
          description: Sign in required
        "403":
          description: Owner permission required
        "404":
          description: Member not found
  /internal/attachments:
    get:
      operationId: listInternalAttachments
      tags: [internal]
      summary: List private attachments
      parameters:
        - name: leadId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Attachment metadata only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrivateAttachment"
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
    post:
      operationId: finalizeInternalAttachment
      tags: [internal]
      summary: Register an uploaded private attachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentFinalizeInput"
      responses:
        "201":
          description: Attachment metadata saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateAttachment"
        "400":
          description: Invalid attachment
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
  /internal/attachments/upload-url:
    post:
      operationId: requestInternalAttachmentUpload
      tags: [internal]
      summary: Request a short-lived private upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadInput"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid attachment metadata
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
  /storage/objects/{objectPath}:
    get:
      operationId: getPrivateAttachment
      tags: [storage]
      summary: Stream a private attachment to an authorized team member
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Sign in required
        "403":
          description: Internal permission required
        "404":
          description: Attachment not found
components:
  schemas:
    CallConfig:
      type: object
      required: [isSynthetic, privacyVersion]
      properties:
        isSynthetic: { type: boolean }
        privacyVersion: { type: string, enum: ["call-2026-11-25-professional"] }
    CallLocale:
      type: string
      enum: [it, en, de, fr, es, nl, pt, pl, ru, sv, "no", da, ar]
    CallProject:
      type: string
      enum: [renovation, construction, concrete_furniture, other, atelier_international, professional_studio]
    ProfessionalIntent:
      type: string
      enum: [samples, block_selection]
    ProfessionalProjectType:
      type: string
      enum: [villa, hotel, resort, yacht, other]
    ProfessionalRequest:
      type: object
      description: "Text-only professional brief. Required for professional_studio submissions; no file upload or remote URL fetching."
      required: [studio, projectType, phase, product, material, dimensions, deadline, intents]
      properties:
        studio: { type: string, minLength: 1, maxLength: 180 }
        projectType: { $ref: "#/components/schemas/ProfessionalProjectType" }
        phase: { type: string, minLength: 1, maxLength: 180 }
        product: { type: string, minLength: 1, maxLength: 180 }
        material: { type: string, minLength: 1, maxLength: 180 }
        dimensions: { type: string, minLength: 1, maxLength: 3000 }
        deadline: { type: string, minLength: 1, maxLength: 180 }
        intents:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProfessionalIntent" }
    CallStatus:
      type: string
      enum: [new, contacted, survey, quote, closed]
    CallDelivery:
      type: string
      enum: [pending_provider, sending, sent, failed, uncertain, simulated]
    CallRequestInput:
      type: object
      required: [idempotencyKey, firstName, lastName, email, mobile, privacyAccepted, privacyVersion, consentLanguage]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 80, pattern: '^[A-Za-z0-9_-]+$' }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        mobile: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        whatsapp: { type: boolean, default: false }
        project: { $ref: "#/components/schemas/CallProject" }
        professional: { $ref: "#/components/schemas/ProfessionalRequest" }
        location: { type: string, maxLength: 180 }
        country: { type: string, minLength: 2, maxLength: 100, description: "Destination country, distinct from property locality. Required for new international Atelier and professional_studio enquiries; absent on historical requests." }
        budget: { type: string, maxLength: 100 }
        startWhen: { type: string, maxLength: 100 }
        timeSlot: { type: string, enum: [morning, afternoon] }
        preferredLanguage: { $ref: "#/components/schemas/CallLocale" }
        message: { type: string, maxLength: 3000 }
        privacyAccepted: { type: boolean, enum: [true] }
        marketingAccepted: { type: boolean, default: false }
        privacyVersion: { type: string, enum: ["call-2026-11-23", "call-2026-11-25", "call-2026-11-25-atelier", "call-2026-11-25-professional"] }
        consentLanguage: { $ref: "#/components/schemas/CallLocale" }
        sourcePath: { type: string, maxLength: 300 }
        utm:
          type: object
          properties:
            utm_source: { type: string, maxLength: 60 }
            utm_medium: { type: string, maxLength: 60 }
            utm_campaign: { type: string, maxLength: 60 }
        companyWebsite: { type: string, maxLength: 200 }
        formOpenedAt: { type: number }
    CallReceipt:
      type: object
      required: [code, createdAt, isSynthetic, ownerDelivery, customerDelivery]
      properties:
        code: { type: string }
        createdAt: { type: string, format: date-time }
        isSynthetic: { type: boolean }
        ownerDelivery: { $ref: "#/components/schemas/CallDelivery" }
        customerDelivery: { $ref: "#/components/schemas/CallDelivery" }
    CallRecord:
      type: object
      required: [id, code, data, createdAt, updatedAt, consentAt, privacyVersion, consentLanguage, status, notes, acquiredCustomer, isSynthetic, ownerDelivery, customerDelivery]
      properties:
        id: { type: integer }
        code: { type: string }
        data: { $ref: "#/components/schemas/CallRequestInput" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        consentAt: { type: string, format: date-time }
        privacyVersion: { type: string }
        consentLanguage: { $ref: "#/components/schemas/CallLocale" }
        status: { $ref: "#/components/schemas/CallStatus" }
        notes: { type: string }
        acquiredCustomer: { type: boolean }
        isSynthetic: { type: boolean }
        ownerDelivery: { $ref: "#/components/schemas/CallDelivery" }
        customerDelivery: { $ref: "#/components/schemas/CallDelivery" }
    CallUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/CallStatus" }
        notes: { type: string, maxLength: 5000 }
        acquiredCustomer: { type: boolean }
    GoogleReview:
      type: object
      required: [text, languageCode, rating, authorName, authorUri, photoDataUri, googleMapsUri]
      properties:
        text: { type: string }
        languageCode: { type: string }
        rating: { type: number, minimum: 1, maximum: 5 }
        authorName: { type: string }
        authorUri: { type: ["string", "null"] }
        photoDataUri: { type: ["string", "null"] }
        googleMapsUri: { type: string }
    GoogleReviewsAttribution:
      type: object
      required: [provider, uri]
      properties:
        provider: { type: string }
        uri: { type: ["string", "null"] }
    GooglePlaceReviews:
      type: object
      required: [rating, userRatingCount, googleMapsUri, writeReviewUri, reviews, attributions]
      properties:
        rating: { type: number, minimum: 1, maximum: 5 }
        userRatingCount: { type: integer, minimum: 1 }
        googleMapsUri: { type: string }
        writeReviewUri: { type: string }
        reviews:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GoogleReview" }
        attributions:
          type: array
          items: { $ref: "#/components/schemas/GoogleReviewsAttribution" }
    GoogleReviewsResponse:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - { $ref: "#/components/schemas/GooglePlaceReviews" }
            - { type: "null" }
    MonitoringCollectionInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    PublicMonitoring:
      type: object
      required: [enabled, origin, runtimeOrigin, measurementId, privacyUrl, privacyVersion, expiresAt]
      properties:
        enabled: { type: boolean }
        origin: { type: string }
        runtimeOrigin: { type: string, description: "Dedicated HTTPS analytics origin on a different registrable domain; never the site or console origin." }
        mode: { type: string, enum: [direct, isolated], description: "Direct consent-gated site loader, or the retained isolated runtime." }
        measurementId: { type: string }
        privacyUrl: { type: string }
        privacyVersion: { type: string }
        expiresAt: { type: string }
    MonitoringCollection:
      type: object
      required: [requested, origin, runtimeOrigin, privacyUrl, privacyVersion, stream, checkedAt, realtimeCheckedAt, realtimeReceivedAt, status]
      properties:
        requested: { type: boolean }
        origin: { type: string }
        runtimeOrigin: { type: string }
        privacyUrl: { type: string }
        privacyVersion: { type: string }
        stream: { type: [string, "null"] }
        checkedAt: { type: [string, "null"] }
        realtimeCheckedAt: { type: [string, "null"] }
        realtimeReceivedAt: { type: [string, "null"] }
        status: { type: string }
    GoogleReportService:
      type: string
      enum: [ga4, searchConsole]
    MonitoringState:
      type: string
      enum: [not_configured, disconnected, property_required, unchecked, ready, empty, delayed, revoked, forbidden, quota, unavailable, stale]
    MonitoringAction:
      type: object
      required: [message]
      properties:
        message: { type: string }
    MonitoringPropertyInput:
      type: object
      required: [property]
      additionalProperties: false
      properties:
        property: { type: string, minLength: 1, maxLength: 500 }
    MonitoringTagInput:
      type: object
      required: [measurementId, containerId]
      additionalProperties: false
      properties:
        measurementId: { type: string, pattern: '^(|G-[A-Z0-9]{4,20})$' }
        containerId: { type: string, pattern: '^(|GTM-[A-Z0-9]{4,20})$' }
    MonitoringProperty:
      type: object
      required: [id, label, timezone]
      properties:
        id: { type: string }
        label: { type: string }
        timezone: { type: string }
    MonitoringService:
      type: object
      required: [service, state, property, lastCheckedAt, lastSuccessAt, error]
      properties:
        service: { $ref: "#/components/schemas/GoogleReportService" }
        state: { $ref: "#/components/schemas/MonitoringState" }
        property: { type: [string, "null"] }
        lastCheckedAt: { type: [string, "null"] }
        lastSuccessAt: { type: [string, "null"] }
        error: { type: [string, "null"] }
    MonitoringDiscovery:
      type: object
      required: [url, checkedAt, findings, limitations]
      properties:
        url: { type: string }
        checkedAt: { type: string }
        stale: { type: boolean }
        error: { type: [string, "null"] }
        findings:
          type: array
          items: { type: string }
        limitations: { type: string }
    MonitoringStreamCheck:
      type: object
      required: [state, measurementId, publicMeasurementId, property, stream, checkedAt, message]
      properties:
        state: { type: string, enum: [unchecked, ready, mismatch, error, stale] }
        measurementId: { type: string }
        publicMeasurementId: { type: string }
        property: { type: [string, "null"] }
        stream: { type: [string, "null"] }
        checkedAt: { type: [string, "null"] }
        message: { type: string }
    MonitoringSettings:
      type: object
      required: [environment, canManage, oauthConfigured, connected, services, tags, updatedAt, trackingEnabled, trackingBlockers, collection, discovery]
      properties:
        environment: { type: string, enum: [development, production] }
        canManage: { type: boolean }
        oauthConfigured: { type: boolean }
        connected: { type: boolean }
        services:
          type: array
          items: { $ref: "#/components/schemas/MonitoringService" }
        tags: { $ref: "#/components/schemas/MonitoringTagInput" }
        updatedAt: { type: string }
        trackingEnabled: { type: boolean }
        collection: { $ref: "#/components/schemas/MonitoringCollection" }
        trackingBlockers:
          type: array
          items: { type: string }
        discovery: { $ref: "#/components/schemas/MonitoringDiscovery" }
        streamCheck: { $ref: "#/components/schemas/MonitoringStreamCheck" }
    KpiPeriod:
      type: object
      required: [start, end, previousStart, previousEnd, days]
      properties:
        start: { type: string }
        end: { type: string }
        previousStart: { type: string }
        previousEnd: { type: string }
        days: { type: integer }
    KpiMetric:
      type: object
      required: [key, label, value, previous, change, unit]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: [number, "null"] }
        previous: { type: [number, "null"] }
        change: { type: [number, "null"] }
        unit: { type: string, enum: [count, percent, position] }
    KpiRow:
      type: object
      required: [label, values]
      properties:
        label: { type: string }
        values:
          type: object
          additionalProperties: { type: [number, "null"] }
    KpiTable:
      type: object
      required: [title, rows]
      properties:
        title: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/KpiRow" }
    KpiSource:
      type: object
      required: [source, state, message, timezone, updatedAt, dataThrough, metrics, series, tables, limitations]
      properties:
        appliedFilters: { type: array, items: { type: string } }
        inapplicableFilters: { type: array, items: { type: string } }
        source: { type: string }
        state: { $ref: "#/components/schemas/MonitoringState" }
        message: { type: string }
        timezone: { type: string }
        updatedAt: { type: [string, "null"] }
        dataThrough: { type: [string, "null"] }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/KpiMetric" }
        series:
          type: array
          items: { $ref: "#/components/schemas/KpiRow" }
        tables:
          type: array
          items: { $ref: "#/components/schemas/KpiTable" }
        limitations:
          type: array
          items: { type: string }
    KpiDashboard:
      type: object
      required: [period, dataMode, operational, ga4, searchConsole]
      properties:
        period: { $ref: "#/components/schemas/KpiPeriod" }
        dataMode: { type: string, enum: [synthetic, live] }
        operational: { $ref: "#/components/schemas/KpiSource" }
        ga4: { $ref: "#/components/schemas/KpiSource" }
        searchConsole: { $ref: "#/components/schemas/KpiSource" }
        bing: { $ref: "#/components/schemas/KpiSource" }
        ai: { $ref: "#/components/schemas/KpiSource" }
        observations: { type: array, items: { $ref: "#/components/schemas/AiObservation" } }
        compare: { type: boolean }
        filters: { type: object, additionalProperties: { type: string } }
        compatibility:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    AiProvider:
      type: string
      enum: [openai, gemini, anthropic]
    AiQuestion:
      type: object
      required: [id, version, text, enabled]
      properties:
        id: { type: string, pattern: '^q(10|[1-9])$' }
        version: { type: integer, minimum: 1 }
        text: { type: string, minLength: 10, maxLength: 240 }
        enabled: { type: boolean }
    AiSettingsInput:
      type: object
      required: [revision, budgetUsd, weeklyEnabled, questions]
      properties:
        revision: { type: string }
        budgetUsd: { type: number, minimum: 0, maximum: 10000 }
        weeklyEnabled: { type: boolean }
        questions:
          type: array
          minItems: 10
          maxItems: 10
          items: { $ref: "#/components/schemas/AiQuestion" }
    AiProviderStatus:
      type: object
      required: [provider, configured, model, method, blockers, maximumUsd]
      properties:
        provider: { $ref: "#/components/schemas/AiProvider" }
        configured: { type: boolean }
        model: { type: string }
        method: { type: string }
        blockers: { type: array, items: { type: string } }
        maximumUsd: { type: [number, "null"] }
        estimatedUsd: { type: [number, "null"] }
    AiSourceEvidence:
      type: object
      required: [url, host, kind]
      properties:
        basis: { type: string, enum: [corporate_title_and_building_domain] }
        url: { type: string }
        host: { type: string }
        kind: { type: string, enum: [brand, directory, unclassified, competitor] }
    AiObservation:
      type: object
      required: [id, question, provider, model, method, at, status, mentioned, cited, grounded, excerpt, sources]
      properties:
        id: { type: string }
        question: { $ref: "#/components/schemas/AiQuestion" }
        provider: { $ref: "#/components/schemas/AiProvider" }
        model: { type: string }
        method: { type: string }
        at: { type: string }
        status: { type: string, enum: [mention, citation, absent, ungrounded, error, blocked, uncertain] }
        mentioned: { type: boolean }
        cited: { type: boolean }
        grounded: { type: boolean }
        excerpt: { type: string, maxLength: 400 }
        sources: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/AiSourceEvidence" } }
    AiCampaign:
      type: object
      required: [id, at, state, completed, total]
      properties:
        id: { type: string }
        at: { type: string }
        state: { type: string }
        completed: { type: integer }
        total: { type: integer }
    AiVisibility:
      type: object
      required: [revision, budgetUsd, spentUsd, reservedUsd, remainingUsd, month, weeklyEnabled, workerReady, schedule, blockers, providers, questions, campaigns, results]
      properties:
        revision: { type: string }
        budgetUsd: { type: number }
        spentUsd: { type: number }
        reservedUsd: { type: number }
        remainingUsd: { type: number }
        month: { type: string }
        weeklyEnabled: { type: boolean }
        workerReady: { type: boolean, deprecated: true, description: "Legacy field, always false. Neither manual execution nor CLI require a worker heartbeat." }
        schedule: { type: string }
        executionMode: { type: string, enum: [site_server] }
        questionCount: { type: integer }
        campaignEstimateUsd: { type: number }
        campaignMaximumUsd: { type: number }
        calendarStatus: { type: string }
        blockers: { type: array, items: { type: string } }
        providers: { type: array, items: { $ref: "#/components/schemas/AiProviderStatus" } }
        questions: { type: array, items: { $ref: "#/components/schemas/AiQuestion" } }
        campaigns: { type: array, items: { $ref: "#/components/schemas/AiCampaign" } }
        results: { type: array, items: { $ref: "#/components/schemas/AiObservation" } }
    BingSettings:
      type: object
      required: [configured, property, instructions]
      properties:
        configured: { type: boolean }
        property: { type: [string, "null"] }
        instructions: { type: string }
    EditorialContent:
      type: object
      required: [title, summary, body, category, tags, image, imageAlt, sources, seoTitle, seoDescription, contentLanguage]
      properties:
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 2000 }
        body: { type: string, maxLength: 150000 }
        category: { type: string, maxLength: 100 }
        tags:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 80 }
        image: { type: string, maxLength: 2000 }
        imageAlt: { type: string, maxLength: 500 }
        sources:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EditorialSource" }
        seoTitle: { type: string, maxLength: 200 }
        seoDescription: { type: string, maxLength: 500 }
        contentLanguage: { type: string, pattern: "^[a-z]{2}$" }
        guide: { $ref: "#/components/schemas/EditorialGuide" }
    EditorialGuide:
      type: object
      required: [episode, technicalReview, editorialReview, languageReview, sourcesCurrent, searchConsoleVerified, faq]
      properties:
        episode: { type: integer, minimum: 1, maximum: 10 }
        reviewBasis: { type: string, enum: [professional, ai-assisted-internal] }
        documentaryReview: { type: string, maxLength: 2000 }
        technicalHeading: { type: string, maxLength: 300 }
        technicalNotice: { type: string, maxLength: 4000 }
        reviewDisclosure: { type: string, maxLength: 2000 }
        technicalReview: { type: string, maxLength: 2000 }
        editorialReview: { type: string, maxLength: 2000 }
        languageReview: { type: string, maxLength: 2000 }
        sourcesCurrent: { type: boolean }
        searchConsoleVerified: { type: boolean }
        faq:
          type: array
          maxItems: 15
          items: { $ref: "#/components/schemas/EditorialFAQ" }
        video: { $ref: "#/components/schemas/EditorialVideo" }
    EditorialFAQ:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }
        answer: { type: string, minLength: 1, maxLength: 4000 }
    EditorialVideo:
      type: object
      required: [youtubeId, title, description, thumbnail, uploadDate, spokenLanguage, author, rights, transcriptLanguage, transcript, transcriptReviewed]
      properties:
        youtubeId: { type: string, pattern: "^[A-Za-z0-9_-]{11}$" }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        thumbnail: { type: string, minLength: 1, maxLength: 2000 }
        uploadDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        duration: { type: string, pattern: "^PT(?=\\d)(?:\\d+H)?(?:\\d+M)?(?:\\d+S)?$" }
        spokenLanguage: { type: string, pattern: "^[a-z]{2}$" }
        author: { type: string, minLength: 1, maxLength: 300 }
        rights: { type: string, minLength: 1, maxLength: 2000 }
        transcriptLanguage: { type: string, pattern: "^[a-z]{2}$" }
        transcript: { type: string, minLength: 1, maxLength: 100000 }
        transcriptReviewed: { type: boolean }
    EditorialSource:
      type: object
      required: [title, url]
      properties:
        title: { type: string, maxLength: 300 }
        url: { type: string, maxLength: 2000 }
    EditorialInput:
      type: object
      required: [identity, locale, path, kind, content]
      properties:
        identity: { type: string, pattern: "^[a-z0-9][a-z0-9/-]{0,179}$" }
        locale: { type: string, pattern: "^[a-z]{2}$" }
        path: { type: string, minLength: 1, maxLength: 250 }
        kind: { type: string, enum: [article, page] }
        content: { $ref: "#/components/schemas/EditorialContent" }
    EditorialSave:
      type: object
      required: [version, content]
      properties:
        version: { type: integer, minimum: 1 }
        content: { $ref: "#/components/schemas/EditorialContent" }
    EditorialAction:
      type: object
      required: [version, action, revisionId]
      properties:
        version: { type: integer, minimum: 1 }
        action: { type: string, enum: [submit, approve, activate, withdraw, restore] }
        revisionId: { type: string }
    EditorialSummary:
      type: object
      required: [id, identity, locale, path, kind, title, version, state, contentLanguage, historical, correction, stale, activeRevisionId]
      properties:
        id: { type: string }
        identity: { type: string }
        locale: { type: string }
        path: { type: string }
        kind: { type: string, enum: [article, page] }
        title: { type: string }
        version: { type: integer }
        state: { type: string, enum: [draft, review, approved, active] }
        contentLanguage: { type: string }
        historical: { type: boolean }
        correction: { type: boolean }
        stale: { type: boolean }
        activeRevisionId: { type: [string, "null"] }
    EditorialRevision:
      type: object
      required: [id, content, hash, sourceHash, createdAt, actor]
      properties:
        id: { type: string }
        content: { $ref: "#/components/schemas/EditorialContent" }
        hash: { type: string }
        sourceHash: { type: string }
        createdAt: { type: string }
        actor: { type: string }
    EditorialEvent:
      type: object
      required: [action, revisionId, actor, at, hash, sourceHash]
      properties:
        action: { type: string }
        revisionId: { type: string }
        actor: { type: string }
        at: { type: string }
        hash: { type: string }
        sourceHash: { type: string }
    EditorialOriginal:
      type: object
      required: [label, url, hash, body, metadata]
      properties:
        label: { type: string }
        url: { type: string }
        hash: { type: string }
        body: { type: string }
        metadata: { type: string }
    EditorialDetail:
      allOf:
        - { $ref: "#/components/schemas/EditorialSummary" }
        - type: object
          required: [revisions, events, originals, source]
          properties:
            revisions:
              type: array
              items: { $ref: "#/components/schemas/EditorialRevision" }
            events:
              type: array
              items: { $ref: "#/components/schemas/EditorialEvent" }
            originals:
              type: array
              items: { $ref: "#/components/schemas/EditorialOriginal" }
            source:
              type: [object, "null"]
              properties:
                hash: { type: string }
                content: { $ref: "#/components/schemas/EditorialContent" }
    EditorialActive:
      type: object
      required: [identity, locale, path, kind, revisionId, content]
      properties:
        aliases:
          type: array
          items: { type: string }
        identity: { type: string }
        locale: { type: string }
        path: { type: string }
        kind: { type: string, enum: [article, page] }
        revisionId: { type: string }
        content: { $ref: "#/components/schemas/EditorialContent" }
    HealthStatus:
      type: object
      properties:
